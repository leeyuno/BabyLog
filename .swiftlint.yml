# BabyLog 서식 규칙. 기준은 CLAUDE.md "서식 규칙" 표와 같습니다.
# 실행: brew install swiftlint && swiftlint
included:
  - BabyLog
  - BabyLogWidget
  - BabyLogTests
  - BabyLogUITests
excluded:
  - DerivedData
  - Pods

disabled_rules:
  - trailing_comma   # 여러 줄 인자·배열은 끝 쉼표를 허용
  - todo             # TODO는 CLAUDE.md '알려진 이슈'와 함께 관리

opt_in_rules:
  - force_unwrapping
  - shorthand_argument

line_length:
  warning: 120
  error: 200
  ignores_urls: false
  ignores_comments: false
function_body_length:
  warning: 50
  error: 100
type_body_length:
  warning: 300
  error: 500
file_length:
  warning: 500
  error: 1000
function_parameter_count:
  warning: 5
  error: 8
identifier_name:
  min_length: 1     # 짧은 지역 변수(r, vm, id 등) 허용
  max_length: 60
